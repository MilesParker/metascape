<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Metascape Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111318'/%3E%3Cg fill='%237c6cff'%3E%3Crect x='7' y='7' width='5' height='5' rx='1'/%3E%3Crect x='14' y='7' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='7' y='14' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='14' y='14' width='5' height='5' rx='1'/%3E%3Crect x='21' y='14' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='14' y='21' width='5' height='5' rx='1' opacity='.5'/%3E%3Crect x='21' y='21' width='5' height='5' rx='1'/%3E%3C/g%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before the first paint, so there is no flash.
      try {
        const theme = localStorage.getItem('metascape:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
